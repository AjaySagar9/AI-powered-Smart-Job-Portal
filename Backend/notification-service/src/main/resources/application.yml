server:
  port: 8086

spring:
  application:
    name: notification-service
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  mail:
    host: email-smtp.us-east-1.amazonaws.com # Mock AWS SES
    port: 587
    username: smtp_username
    password: smtp_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
