server:
  port: 8084

spring:
  application:
    name: resume-service
  datasource:
    url: jdbc:postgresql://localhost:5432/portal_db
    username: root
    password: rootpassword
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

aws:
  s3:
    bucket-name: smart-job-portal-resumes
    region: us-east-1
